      font-weight: 600;
      color: #475569;
    }

      border-radius: 6px;
      font-size: 13px;
      outline: none;
      background-color: #fff;

    .btn-export {
      background-color: #10b981;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }
    .btn-export:hover {
      background-color: #059669;
    }
    .status-legend {

      align-items: center;
      gap: 15px;
      margin-top: 15px;
      padding-top: 12px;
      border-top: 1px solid #f1f5f9;
      font-size: 12px;
      font-weight: 600;
      color: #475569;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 4px;
    }
    .dot-green { background-color: #10b981; }
    .dot-orange { background-color: #f59e0b; }
    .dot-red { background-color: #ef4444; }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr) 300px;
      gap: 15px;
      margin-bottom: 25px;
    }
    .kpi-card {
      background: #fff;
      border-radius: 10px;
      padding: 20px 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      border-left: 4px solid #cbd5e1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .kpi-card.blue { border-left-color: #3b82f6; }
    .kpi-card.red { border-left-color: #ef4444; }
    .kpi-card.orange { border-left-color: #f59e0b; }
    
    .kpi-title {
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .kpi-value {
      font-size: 26px;
      font-weight: 800;
      color: #0f172a;
      margin-top: 10px;
    }

      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);

      display: flex;
      align-items: center;
      gap: 6px;

    .critical-item {
      background: #fef2f2;
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;

    }

      font-size: 12px;
      font-weight: 700;
      color: #1e293b;
    }
    .critical-store-sub {
      font-size: 10px;
      color: #64748b;
    }
    .critical-store-pct {
      font-size: 13px;
      font-weight: 800;
      color: #991b1b;
    }

      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);

    }
    table {

      text-align: left;

      font-weight: 700;
      color: #64748b;

    function inicializar() {
      const selectData = document.getElementById('selectData');
      const datas = [...new Set(dados.map(item => item.data))].sort();
      
      datas.forEach(d => {
        const option = document.createElement('option');
        option.value = d;
        option.textContent = d.split('-').reverse().join('/');
        selectData.appendChild(option);
      });

      atualizarDashboard();
    }

    function atualizarDashboard() {
      const dataSel = document.getElementById('selectData').value;
      const buscaLoja = document.getElementById('inputLoja').value.toLowerCase();

      let dadosFiltrados = dados;
      if (dataSel !== 'todas') {
        dadosFiltrados = dados.filter(item => item.data === dataSel);
      }

      const resumoLojas = {};
      dadosFiltrados.forEach(item => {
        if (!resumoLojas[item.loja]) {
          resumoLojas[item.loja] = { compras: 0, itens: 0, excluidos: 0 };
        }
        resumoLojas[item.loja].compras += item.compras;
        resumoLojas[item.loja].itens += item.itens;
        resumoLojas[item.loja].excluidos += item.excluidos;
      });

      let listaLojas = Object.keys(resumoLojas).map(loja => {
        const d = resumoLojas[loja];
        const pct = d.itens > 0 ? (d.excluidos / d.itens) * 100 : 0;
        return { loja, compras: d.compras, itens: d.itens, excluidos: d.excluidos, pct };
      });

      const totCompras = listaLojas.reduce((a, b) => a + b.compras, 0);
      const totItens = listaLojas.reduce((a, b) => a + b.itens, 0);
      const totExcluidos = listaLojas.reduce((a, b) => a + b.excluidos, 0);
      const pctGeral = totItens > 0 ? (totExcluidos / totItens) * 100 : 0;

      document.getElementById('kpiCompras').textContent = totCompras.toLocaleString('pt-BR');
      document.getElementById('kpiItens').textContent = totItens.toLocaleString('pt-BR');
      document.getElementById('kpiExcluidos').textContent = totExcluidos.toLocaleString('pt-BR');
      document.getElementById('kpiPctGeral').textContent = pctGeral.toFixed(2).replace('.', ',') + '%';

      listaLojas.sort((a, b) => b.pct - a.pct);

      const containerCritical = document.getElementById('containerCritical');
      containerCritical.innerHTML = '';
      listaLojas.slice(0, 3).forEach((item, index) => {
        containerCritical.innerHTML += `
          <div class="critical-item">
            <div>
              <div class="critical-store-name">${index + 1}º ${item.loja}</div>
              <div class="critical-store-sub">${item.excluidos.toLocaleString('pt-BR')} excluídos de ${item.itens.toLocaleString('pt-BR')} itens</div>
            </div>
            <div class="critical-store-pct">${item.pct.toFixed(2).replace('.', ',')}%</div>
          </div>
        `;
      });

      if (buscaLoja) {
        listaLojas = listaLojas.filter(item => item.loja.toLowerCase().includes(buscaLoja));
      }

      const tbody = document.getElementById('tabelaCorpo');
      tbody.innerHTML = '';
      listaLojas.forEach(item => {
        let badgeClass = 'bg-green';
        if (item.pct > 20) badgeClass = 'bg-red';
        else if (item.pct > 10) badgeClass = 'bg-orange';

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${item.loja}</strong></td>
          <td>${item.compras.toLocaleString('pt-BR')}</td>
          <td>${item.itens.toLocaleString('pt-BR')}</td>
          <td>${item.excluidos.toLocaleString('pt-BR')}</td>
          <td><span class="badge-pct ${badgeClass}">${item.pct.toFixed(2).replace('.', ',')}%</span></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function exportarExcel() {
      const table = document.querySelector("table");
      const wb = XLSX.utils.table_to_book(table, { sheet: "Rupturas" });
      XLSX.writeFile(wb, "Rupturas_Loja_Online.xlsx");
    }

    window.onload = inicializar;
  </script>
