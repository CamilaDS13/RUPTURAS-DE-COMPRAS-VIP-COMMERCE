<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RUPTURAS DA LOJA ONLINE - Real Time</title>
  <!-- Bibliotecas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #f4f6f9; color: #333; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    
    /* Header */
    .header { background: #fff; border-radius: 12px; padding: 20px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; position: relative; }
    .header h1 { font-size: 20px; font-weight: 800; color: #1e293b; letter-spacing: 0.5px; }
    .header p { font-size: 13px; color: #64748b; margin-top: 4px; }
    .status-sync { font-size: 11px; font-weight: bold; color: #10b981; margin-top: 5px; display: block; }

    /* Controls & Filters */
    .controls-card { background: #fff; border-radius: 12px; padding: 16px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
    .filters-row { display: flex; flex-wrap: wrap; align-items: center; gap: 15px; }
    .filter-group { display: flex; align-items: center; gap: 8px; }
    .filter-group label { font-size: 13px; font-weight: 600; color: #475569; }
    select, input[type="text"] { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; outline: none; background-color: #fff; }
    
    .btn-export { background-color: #10b981; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; margin-left: auto; }
    .btn-export:hover { background-color: #059669; }

    .status-legend { display: flex; align-items: center; gap: 15px; margin-top: 15px; padding-top: 12px; border-top: 1px solid #f1f5f9; font-size: 12px; font-weight: 600; color: #475569; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
    .dot-green { background-color: #10b981; }
    .dot-orange { background-color: #f59e0b; }
    .dot-red { background-color: #ef4444; }

    /* Dashboard Grid */
    .dashboard-grid { display: grid; grid-template-columns: repeat(4, 1fr) 300px; gap: 15px; margin-bottom: 25px; }
    @media (max-width: 1024px) { .dashboard-grid { grid-template-columns: repeat(2, 1fr); } .critical-card { grid-column: span 2; } }
    
    .kpi-card { background: #fff; border-radius: 10px; padding: 20px 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 4px solid #cbd5e1; display: flex; flex-direction: column; justify-content: space-between; }
    .kpi-card.blue { border-left-color: #3b82f6; }
    .kpi-card.red { border-left-color: #ef4444; }
    .kpi-card.orange { border-left-color: #f59e0b; }
    .kpi-title { font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
    .kpi-value { font-size: 26px; font-weight: 800; color: #0f172a; margin-top: 10px; }

    /* Top Critical Stores */
    .critical-card { background: #fff; border-radius: 10px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .critical-title { font-size: 12px; font-weight: 800; color: #991b1b; text-transform: uppercase; display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }
    .critical-item { background: #fef2f2; border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .critical-store-name { font-size: 12px; font-weight: 700; color: #1e293b; }
    .critical-store-sub { font-size: 10px; color: #64748b; }
    .critical-store-pct { font-size: 13px; font-weight: 800; color: #991b1b; }

    /* Table */
    .table-container { background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background-color: #f8fafc; padding: 12px 16px; font-size: 12px; font-weight: 700; color: #64748b; border-bottom: 1px solid #e2e8f0; }
    td { padding: 14px 16px; font-size: 13px; color: #334155; border-bottom: 1px solid #f1f5f9; }
    tr:hover { background-color: #f8fafc; }
    .badge-pct { padding: 4px 8px; border-radius: 4px; font-weight: 700; font-size: 12px; display: inline-block; }
    .bg-green { background-color: #d1fae5; color: #065f46; }
    .bg-orange { background-color: #fef3c7; color: #92400e; }
    .bg-red { background-color: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>RUPTURAS DA LOJA ONLINE</h1>
      <p>Status: <span id="lblStatus" class="status-sync">Conectando...</span></p>
    </div>

    <div class="controls-card">
      <div class="filters-row">
        <div class="filter-group">
          <label>Mês/Ano:</label>
          <select id="selectMes">
            <option value="2026-08">Agosto / 2026</option>
          </select>
        </div>

        <div class="filter-group">
          <label>Data:</label>
          <select id="selectData" onchange="atualizarDashboard()">
            <option value="todas">Visão Geral do Mês</option>
          </select>
        </div>

        <div class="filter-group">
          <label>Loja:</label>
          <input type="text" id="inputLoja" placeholder="Pesquisar loja..." oninput="atualizarDashboard()">
        </div>

        <button class="btn-export" onclick="exportarExcel()">📊 Exportar Excel</button>
      </div>

      <div class="status-legend">
        <span>Status:</span>
        <span><span class="dot dot-green"></span>Até 10%</span>
        <span><span class="dot dot-orange"></span>10,01% a 20%</span>
        <span><span class="dot dot-red"></span>Acima de 20%</span>
      </div>
    </div>

    <div class="dashboard-grid">
      <div class="kpi-card blue">
        <div class="kpi-title">QTD COMPRAS</div>
        <div class="kpi-value" id="kpiCompras">0</div>
      </div>
      <div class="kpi-card blue">
        <div class="kpi-title">TOTAL ITENS</div>
        <div class="kpi-value" id="kpiItens">0</div>
      </div>
      <div class="kpi-card red">
        <div class="kpi-title">EXCLUÍDOS / RUPTURAS</div>
        <div class="kpi-value" id="kpiExcluidos">0</div>
      </div>
      <div class="kpi-card orange">
        <div class="kpi-title">% RUPTURA GERAL</div>
        <div class="kpi-value" id="kpiPctGeral">0,00%</div>
      </div>

      <div class="critical-card">
        <div class="critical-title">🚨 TOP 3 LOJAS CRÍTICAS</div>
        <div id="containerCritical"></div>
      </div>
    </div>

    <div class="table-container">
      <table id="tabelaDados">
        <thead>
          <tr>
            <th>Loja</th>
            <th>Qtd Compra</th>
            <th>Total Itens</th>
            <th>Excluídos</th>
            <th>% Ruptura</th>
          </tr>
        </thead>
        <tbody id="tabelaCorpo"></tbody>
      </table>
    </div>
  </div>

  <script>
    const URL_RUPTURAS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT0KwpuVk1bxrb_DLjb9wVVnvLNzlYcZN-UWt7seAAzAjgyoF5Hmd9wzSeGFWgGWM11WTOf7LCpIf6b/pub?output=csv";

    let dadosGlobais = [];

    async function buscarDados() {
      try {
        const response = await fetch(URL_RUPTURAS + "&t=" + new Date().getTime());
        const csvText = await response.text();
        const rows = parseCSV(csvText);
        
        if (rows.length > 1) {
            processarDadosDinamico(rows);
            document.getElementById('lblStatus').innerText = "✅ Sincronizado com Google Sheets";
        }
      } catch (err) {
        document.getElementById('lblStatus').innerText = "❌ Erro na conexão.";
        console.error(err);
      }
    }

    function parseCSV(text) {
        return text.split('\n').map(line => {
            const parts = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            return parts.map(p => p.replace(/^"|"$/g, '').trim());
        });
    }

    function processarDadosDinamico(rows) {
      // Identifica a linha do cabeçalho
      let headerIdx = rows.findIndex(r => r.some(c => c && c.toString().toLowerCase().includes("loja")));
      if (headerIdx === -1) headerIdx = 0;

      const header = rows[headerIdx].map(h => h ? h.toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "") : "");
      
      // Mapeamento automático por nome de coluna
      const idxLoja = header.findIndex(h => h.includes("loja"));
      const idxData = header.findIndex(h => h.includes("data"));
      const idxCompras = header.findIndex(h => h.includes("compra") || h.includes("qtd"));
      const idxItens = header.findIndex(h => h.includes("itens") || h.includes("total"));
      const idxExcluidos = header.findIndex(h => h.includes("exclui") || h.includes("ruptura"));

      dadosGlobais = rows.slice(headerIdx + 1).filter(r => r[idxLoja] && r[idxLoja] !== "").map(row => {
          return {
              data: row[idxData] || "-",
              loja: row[idxLoja],
              compras: parseInt(row[idxCompras]) || 0,
              itens: parseInt(row[idxItens]) || 0,
              excluidos: parseInt(row[idxExcluidos]) || 0
          };
      });

      // Preencher o filtro de data
      const selectData = document.getElementById('selectData');
      const datasUnicas = [...new Set(dadosGlobais.map(item => item.data))].filter(d => d !== "-").sort();
      
      selectData.innerHTML = '<option value="todas">Visão Geral do Mês</option>';
      datasUnicas.forEach(d => {
          const option = document.createElement('option');
          option.value = d;
          option.textContent = d;
          selectData.appendChild(option);
      });

      atualizarDashboard();
    }

    function atualizarDashboard() {
      const dataSel = document.getElementById('selectData').value;
      const buscaLoja = document.getElementById('inputLoja').value.toLowerCase();

      let dadosFiltrados = dataSel === 'todas' ? dadosGlobais : dadosGlobais.filter(item => item.data === dataSel);

      const resumoLojas = {};
      dadosFiltrados.forEach(item => {
        if (!resumoLojas[item.loja]) {
          resumoLojas[item.loja] = { compras: 0, itens: 0, excluidos: 0 };
        }
        resumoLojas[item.loja].compras += item.compras;
        resumoLojas[item.loja].itens += item.itens;
        resumoLojas[item.loja].excluidos += item.excluidos;
      });

      let listaLojas = Object.keys(resumoLojas).map(loja => {
        const d = resumoLojas[loja];
        const pct = d.itens > 0 ? (d.excluidos / d.itens) * 100 : 0;
        return { loja, compras: d.compras, itens: d.itens, excluidos: d.excluidos, pct };
      });

      // KPIs
      const totCompras = listaLojas.reduce((a, b) => a + b.compras, 0);
      const totItens = listaLojas.reduce((a, b) => a + b.itens, 0);
      const totExcluidos = listaLojas.reduce((a, b) => a + b.excluidos, 0);
      const pctGeral = totItens > 0 ? (totExcluidos / totItens) * 100 : 0;

      document.getElementById('kpiCompras').textContent = totCompras.toLocaleString('pt-BR');
      document.getElementById('kpiItens').textContent = totItens.toLocaleString('pt-BR');
      document.getElementById('kpiExcluidos').textContent = totExcluidos.toLocaleString('pt-BR');
      document.getElementById('kpiPctGeral').textContent = pctGeral.toFixed(2).replace('.', ',') + '%';

      // Top 3 Críticas
      listaLojas.sort((a, b) => b.pct - a.pct);
      const containerCritical = document.getElementById('containerCritical');
      containerCritical.innerHTML = '';
      listaLojas.slice(0, 3).forEach((item, index) => {
        containerCritical.innerHTML += `
          <div class="critical-item">
            <div>
              <div class="critical-store-name">${index + 1}º ${item.loja}</div>
              <div class="critical-store-sub">${item.excluidos.toLocaleString('pt-BR')} excl. de ${item.itens.toLocaleString('pt-BR')} itens</div>
            </div>
            <div class="critical-store-pct">${item.pct.toFixed(2).replace('.', ',')}%</div>
          </div>
        `;
      });

      // Filtro de pesquisa de loja
      if (buscaLoja) {
        listaLojas = listaLojas.filter(item => item.loja.toLowerCase().includes(buscaLoja));
      }

      // Tabela Principal
      const tbody = document.getElementById('tabelaCorpo');
      tbody.innerHTML = '';
      listaLojas.forEach(item => {
        let badgeClass = 'bg-green';
        if (item.pct > 20) badgeClass = 'bg-red';
        else if (item.pct > 10) badgeClass = 'bg-orange';

        tbody.innerHTML += `
          <tr>
            <td><strong>${item.loja}</strong></td>
            <td>${item.compras.toLocaleString('pt-BR')}</td>
            <td>${item.itens.toLocaleString('pt-BR')}</td>
            <td>${item.excluidos.toLocaleString('pt-BR')}</td>
            <td><span class="badge-pct ${badgeClass}">${item.pct.toFixed(2).replace('.', ',')}%</span></td>
          </tr>
        `;
      });
    }

    function exportarExcel() {
      const table = document.getElementById("tabelaDados");
      const wb = XLSX.utils.table_to_book(table, { sheet: "Rupturas" });
      XLSX.writeFile(wb, "Rupturas_Consolidado.xlsx");
    }

    window.onload = buscarDados;
  </script>
</body>
</html>
