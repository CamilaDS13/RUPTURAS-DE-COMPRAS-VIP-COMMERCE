<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub de Dados Pinheiro - Ruptura</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-main: #ffffff;
            --text-dim: #8b949e;
            --green: #238636;
            --blue: #58a6ff;
            --border: #30363d;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 1400px; margin: 0 auto; }
        header { margin-bottom: 25px; }
        .sub-header { color: var(--text-dim); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.5px; }
        h1 { font-size: 2.2rem; margin: 5px 0 15px 0; font-weight: 800; }

        .status-badges { display: flex; gap: 10px; margin-bottom: 20px; }
        .badge {
            background: #21262d;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--border);
        }
        .dot { height: 10px; width: 10px; border-radius: 50%; background-color: var(--green); box-shadow: 0 0 10px var(--green); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        .filter-bar {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
            margin-bottom: 25px;
        }

        .filter-group { display: flex; flex-direction: column; gap: 8px; }
        .filter-group label { font-size: 0.7rem; color: var(--text-dim); font-weight: bold; text-transform: uppercase; }
        
        select {
            background: #0d1117;
            color: white;
            border: 1px solid var(--border);
            padding: 10px 15px;
            border-radius: 8px;
            min-width: 160px;
            cursor: pointer;
            outline: none;
        }

        .btn-reset { background: #21262d; color: white; border: 1px solid var(--border); padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; }
        .btn-export { background: var(--green); color: white; border: none; padding: 10px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-left: auto; display: flex; align-items: center; gap: 8px; }

        .ranking-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 25px; }
        .rank-card { background: linear-gradient(145deg, #1e1b4b, #0d1117); padding: 20px; border-radius: 15px; border: 1px solid var(--border); text-align: center; }
        .rank-card h4 { margin: 0 0 10px 0; color: var(--text-dim); font-size: 0.75rem; text-transform: uppercase; }
        .rank-loja { font-size: 1.1rem; font-weight: bold; display: block; margin-bottom: 5px; }
        .rank-val { font-size: 2rem; font-weight: 800; color: var(--blue); }

        .table-container { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th { text-align: left; padding: 15px; color: var(--text-dim); border-bottom: 1px solid var(--border); font-size: 0.75rem; text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid #21262d; font-size: 0.9rem; }

        .perf-red { color: #f85149; font-weight: bold; }
        .perf-green { color: #3fb950; font-weight: bold; }

        .legend { margin-top: 20px; display: flex; gap: 20px; font-size: 0.8rem; color: var(--text-dim); background: #161b22; padding: 15px; border-radius: 8px; border: 1px solid var(--border); }
        .status-dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="sub-header">Central de Inteligência Operacional</div>
            <h1>HUB DE DADOS PINHEIRO</h1>
            <div class="status-badges">
                <div class="badge"><span class="dot"></span> Sistema Online</div>
                <div id="sync-badge" class="badge"><i class="fas fa-sync fa-spin"></i> Sincronizando...</div>
            </div>
        </header>

        <div class="filter-bar">
            <div class="filter-group">
                <label>Mês</label>
                <!-- Mudança aqui: quando o mês muda, ele reconstrói o filtro de DIA -->
                <select id="filter-mes" onchange="updateDiaFilter(); applyFilters();"><option value="all">Consolidado</option></select>
            </div>
            <div class="filter-group">
                <label>Dia</label>
                <select id="filter-dia" onchange="applyFilters()"><option value="all">Todos os Dias</option></select>
            </div>
            <div class="filter-group">
                <label>Loja</label>
                <select id="filter-loja" onchange="applyFilters()"><option value="all">Todas as Lojas</option></select>
            </div>
            <button class="btn-reset" onclick="resetFilters()">Limpar Filtros</button>
            <button class="btn-export" onclick="exportExcel()"><i class="fas fa-file-excel"></i> Exportar Excel</button>
        </div>

        <div id="ranking-box" class="ranking-container"></div>

        <div class="table-container">
            <table id="data-table">
                <thead><tr id="table-header"></tr></thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>

        <div class="legend">
            <span><strong>PERFORMANCE:</strong></span>
            <span><span class="status-dot" style="background: var(--green);"></span> Baixa Ruptura</span>
            <span><span class="status-dot" style="background: var(--red);"></span> Alta Ruptura (> 10%)</span>
        </div>
    </div>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT0KwpuVk1bxrb_DLjb9wVVnvLNzlYcZN-UWt7seAAzAjgyoF5Hmd9wzSeGFWgGWM11WTOf7LCpIf6b/pub?output=csv';
        let rawData = [];
        const mesesNomes = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];

        fetchData();
        setInterval(fetchData, 60000);

        function fetchData() {
            Papa.parse(SHEET_URL, {
                download: true,
                header: true,
                dynamicTyping: true,
                skipEmptyLines: true,
                complete: function(results) {
                    if(results.data.length > 0) {
                        rawData = results.data.map(row => {
                            if(row.DATA) {
                                const partes = row.DATA.split('/');
                                if(partes.length >= 2) {
                                    const mesIndex = parseInt(partes[1]) - 1;
                                    row._mesNome = mesesNomes[mesIndex] || "Outros";
                                }
                            }
                            return row;
                        });
                        document.getElementById('sync-badge').innerHTML = `<i class="far fa-clock"></i> Sincronizado: ${new Date().toLocaleTimeString()}`;
                        
                        setupInitialFilters(); // Preenche Mês e Loja uma única vez
                        updateDiaFilter();    // Preenche Dia com base no Mês atual
                        applyFilters();
                    }
                }
            });
        }

        function setupInitialFilters() {
            const selectMes = document.getElementById('filter-mes');
            const selectLoja = document.getElementById('filter-loja');

            if (selectMes.options.length > 1) return; // Evita duplicar se já preenchido

            // Preencher Mês
            const mesesUnicos = [...new Set(rawData.map(r => r._mesNome))].filter(v => v);
            mesesUnicos.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m; opt.textContent = m;
                selectMes.appendChild(opt);
            });

            // Preencher Loja
            const lojasUnicas = [...new Set(rawData.map(r => r.LOJA))].filter(v => v).sort();
            lojasUnicas.forEach(l => {
                const opt = document.createElement('option');
                opt.value = l; opt.textContent = l;
                selectLoja.appendChild(opt);
            });
        }

        // NOVA FUNÇÃO: Atualiza os dias com base no mês selecionado
        function updateDiaFilter() {
            const mesSelecionado = document.getElementById('filter-mes').value;
            const selectDia = document.getElementById('filter-dia');
            
            // Salva o dia atual para tentar manter a seleção se possível
            const diaAtual = selectDia.value;
            
            // Limpa o select de dias
            selectDia.innerHTML = '<option value="all">Todos os Dias</option>';

            // Filtra os dados pelo mês para pegar apenas as datas daquele mês
            const dadosDoMes = mesSelecionado === 'all' 
                ? rawData 
                : rawData.filter(r => r._mesNome === mesSelecionado);

            // Pega datas únicas e ordena (como texto DD/MM/AAAA)
            const diasUnicos = [...new Set(dadosDoMes.map(r => r.DATA))].filter(v => v).sort((a,b) => {
                // Ordenação lógica por data (transforma DD/MM em MM/DD para o sort)
                const aP = a.split('/'); const bP = b.split('/');
                return new Date(aP[2], aP[1], aP[0]) - new Date(bP[2], bP[1], bP[0]);
            });

            diasUnicos.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d; opt.textContent = d;
                if(d === diaAtual) opt.selected = true;
                selectDia.appendChild(opt);
            });
        }

        function applyFilters() {
            const mesVal = document.getElementById('filter-mes').value;
            const diaVal = document.getElementById('filter-dia').value;
            const lojaVal = document.getElementById('filter-loja').value;

            const filtered = rawData.filter(row => {
                const m = mesVal === 'all' || row._mesNome === mesVal;
                const d = diaVal === 'all' || row.DATA === diaVal;
                const l = lojaVal === 'all' || row.LOJA === lojaVal;
                return m && d && l;
            });

            renderDashboard(filtered);
        }

        function renderDashboard(data) {
            const tableHeader = document.getElementById('table-header');
            const tableBody = document.getElementById('table-body');
            const rankingBox = document.getElementById('ranking-box');

            if (data.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="10" style="text-align:center; padding: 30px;">Sem dados para este período.</td></tr>';
                rankingBox.innerHTML = '';
                return;
            }

            const headers = Object.keys(data[0]).filter(h => h !== '_mesNome');
            tableHeader.innerHTML = headers.map(h => `<th>${h}</th>`).join('');

            // Ranking
            const metricKey = headers.find(h => h.includes('%')) || headers[headers.length-1];
            const sorted = [...data].sort((a, b) => (parseFloat(b[metricKey]) || 0) - (parseFloat(a[metricKey]) || 0)).slice(0, 3);
            const medals = ['🥇 1º LUGAR', '🥈 2º LUGAR', '🥉 3º LUGAR'];
            
            rankingBox.innerHTML = sorted.map((item, i) => `
                <div class="rank-card">
                    <h4>${medals[i]}</h4>
                    <span class="rank-loja">${item.LOJA || '---'}</span>
                    <div class="rank-val">${item[metricKey]}${typeof item[metricKey] === 'number' ? '%' : ''}</div>
                </div>
            `).join('');

            // Tabela
            tableBody.innerHTML = data.map(row => `
                <tr>
                    ${headers.map(h => {
                        let val = row[h];
                        let cls = '';
                        if (typeof val === 'number' && h.includes('%')) {
                            cls = val > 10 ? 'perf-red' : 'perf-green';
                            val = val.toFixed(1) + '%';
                        }
                        return `<td class="${cls}">${val ?? '-'}</td>`;
                    }).join('')}
                </tr>
            `).join('');
        }

        function resetFilters() {
            document.getElementById('filter-mes').value = 'all';
            updateDiaFilter(); // Reseta os dias para todos
            document.getElementById('filter-loja').value = 'all';
            applyFilters();
        }

        function exportExcel() {
            const table = document.getElementById("data-table");
            const wb = XLSX.utils.table_to_book(table);
            XLSX.writeFile(wb, "Relatorio_Ruptura_Pinheiro.xlsx");
        }
    </script>
</body>
</html>
