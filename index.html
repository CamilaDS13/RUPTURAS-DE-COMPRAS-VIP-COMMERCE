<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub de Dados Pinheiro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-main: #ffffff;
            --text-dim: #8b949e;
            --green: #238636;
            --blue: #58a6ff;
            --border: #30363d;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        header { margin-bottom: 25px; }
        .sub-header { color: var(--text-dim); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.5px; }
        h1 { font-size: 2.2rem; margin: 5px 0 15px 0; font-weight: 800; }

        .status-badges { display: flex; gap: 10px; margin-bottom: 20px; }
        .badge {
            background: #21262d;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--border);
        }

        .dot {
            height: 10px; width: 10px;
            border-radius: 50%;
            background-color: var(--green);
            box-shadow: 0 0 10px var(--green);
            animation: pulse 2s infinite;
        }
        .dot.error { background-color: #f85149; box-shadow: 0 0 10px #f85149; animation: none; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* Filtros */
        .filter-bar {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
            margin-bottom: 25px;
        }

        .filter-group { display: flex; flex-direction: column; gap: 8px; }
        .filter-group label { font-size: 0.7rem; color: var(--text-dim); font-weight: bold; text-transform: uppercase; }
        
        select {
            background: #0d1117;
            color: white;
            border: 1px solid var(--border);
            padding: 10px 15px;
            border-radius: 8px;
            min-width: 160px;
            cursor: pointer;
            outline: none;
        }

        .btn-reset {
            background: #21262d;
            color: white;
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .btn-export {
            background: var(--green);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Ranking */
        .ranking-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .rank-card {
            background: linear-gradient(145deg, #1e1b4b, #0d1117);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid var(--border);
            text-align: center;
        }
        .rank-card h4 { margin: 0 0 10px 0; color: var(--text-dim); font-size: 0.75rem; text-transform: uppercase; }
        .rank-loja { font-size: 1.1rem; font-weight: bold; display: block; margin-bottom: 5px; }
        .rank-val { font-size: 2rem; font-weight: 800; color: var(--blue); }

        /* Tabela */
        .table-container {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow-x: auto;
        }

        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th { text-align: left; padding: 15px; color: var(--text-dim); border-bottom: 1px solid var(--border); font-size: 0.75rem; text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid #21262d; font-size: 0.9rem; }

        .perf-green { color: #3fb950; font-weight: bold; }
        .perf-yellow { color: #d29922; font-weight: bold; }
        .perf-red { color: #f85149; font-weight: bold; }

        .legend { margin-top: 20px; display: flex; gap: 20px; font-size: 0.8rem; color: var(--text-dim); background: #161b22; padding: 15px; border-radius: 8px; border: 1px solid var(--border); }
        .status-dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="sub-header">Central de Inteligência Operacional</div>
            <h1>HUB DE DADOS PINHEIRO</h1>
            
            <div class="status-badges">
                <div class="badge"><span id="status-dot" class="dot"></span> Sistema Online</div>
                <div id="sync-badge" class="badge"><i class="fas fa-sync fa-spin"></i> Iniciando conexão...</div>
            </div>
        </header>

        <div class="filter-bar">
            <div class="filter-group">
                <label>Mês</label>
                <select id="filter-mes" onchange="applyFilters()"><option value="all">Consolidado</option></select>
            </div>
            <div class="filter-group">
                <label>Dia</label>
                <select id="filter-dia" onchange="applyFilters()"><option value="all">Todos os Dias</option></select>
            </div>
            <div class="filter-group">
                <label>Loja</label>
                <select id="filter-loja" onchange="applyFilters()"><option value="all">Todas as Lojas</option></select>
            </div>
            
            <button class="btn-reset" onclick="resetFilters()">Limpar Filtros</button>

            <button class="btn-export" onclick="exportExcel()">
                <i class="fas fa-file-excel"></i> Exportar Excel
            </button>
        </div>

        <div id="ranking-box" class="ranking-container"></div>

        <div class="table-container">
            <table id="data-table">
                <thead><tr id="table-header"></tr></thead>
                <tbody id="table-body">
                    <tr><td colspan="10" style="text-align:center; padding: 50px;">Aguardando dados da planilha...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="legend">
            <span><strong>PERFORMANCE:</strong></span>
            <span><span class="status-dot" style="background: var(--green);"></span> Meta Batida (> 95%)</span>
            <span><span class="status-dot" style="background: var(--yellow);"></span> Atenção (90% - 95%)</span>
            <span><span class="status-dot" style="background: var(--red);"></span> Crítico (< 90%)</span>
        </div>
    </div>

    <script>
        // LINK DA SUA PLANILHA
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT0KwpuVk1bxrb_DLjb9wVVnvLNzlYcZN-UWt7seAAzAjgyoF5Hmd9wzSeGFWgGWM11WTOf7LCpIf6b/pub?output=csv';
        
        let rawData = [];
        let colLoja, colMes, colDia;

        // Inicia o processo
        fetchData();
        setInterval(fetchData, 60000); // Atualiza a cada 1 minuto

        function fetchData() {
            // Usando o download direto do PapaParse para evitar erros de CORS locais
            Papa.parse(SHEET_URL, {
                download: true,
                header: true,
                dynamicTyping: true,
                skipEmptyLines: true,
                complete: function(results) {
                    if(results.data && results.data.length > 0) {
                        rawData = results.data;
                        document.getElementById('status-dot').className = 'dot';
                        document.getElementById('sync-badge').innerHTML = `<i class="far fa-calendar-check"></i> Sincronizado: ${new Date().toLocaleTimeString()}`;
                        
                        detectColumns(Object.keys(rawData[0]));
                        setupFilters();
                        applyFilters();
                    }
                },
                error: function(err) {
                    console.error("Erro PapaParse:", err);
                    document.getElementById('status-dot').className = 'dot error';
                    document.getElementById('sync-badge').innerHTML = `<i class="fas fa-exclamation-triangle"></i> Erro ao conectar planilha`;
                }
            });
        }

        function detectColumns(headers) {
            colLoja = headers.find(h => h.toLowerCase().includes('loja')) || headers[0];
            colMes = headers.find(h => h.toLowerCase().includes('mês') || h.toLowerCase().includes('mes'));
            colDia = headers.find(h => h.toLowerCase().includes('dia') || h.toLowerCase().includes('data'));
        }

        function setupFilters() {
            updateSelect('filter-mes', colMes);
            updateSelect('filter-dia', colDia);
            updateSelect('filter-loja', colLoja);
        }

        function updateSelect(id, colName) {
            const select = document.getElementById(id);
            const currentVal = select.value;
            
            // Limpa mantendo o "Todos/Consolidado"
            select.innerHTML = id === 'filter-mes' ? '<option value="all">Consolidado</option>' : 
                              (id === 'filter-dia' ? '<option value="all">Todos os Dias</option>' : '<option value="all">Todas as Lojas</option>');

            if (!colName) return;

            const uniqueValues = [...new Set(rawData.map(item => item[colName]).filter(v => v))];
            uniqueValues.sort().forEach(val => {
                const opt = document.createElement('option');
                opt.value = val;
                opt.textContent = val;
                if (val == currentVal) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function applyFilters() {
            const mesVal = document.getElementById('filter-mes').value;
            const diaVal = document.getElementById('filter-dia').value;
            const lojaVal = document.getElementById('filter-loja').value;

            const filtered = rawData.filter(row => {
                const m = mesVal === 'all' || (colMes && row[colMes] == mesVal);
                const d = diaVal === 'all' || (colDia && row[colDia] == diaVal);
                const l = lojaVal === 'all' || row[colLoja] == lojaVal;
                return m && d && l;
            });

            renderDashboard(filtered);
        }

        function resetFilters() {
            document.getElementById('filter-mes').value = 'all';
            document.getElementById('filter-dia').value = 'all';
            document.getElementById('filter-loja').value = 'all';
            applyFilters();
        }

        function renderDashboard(data) {
            const tableHeader = document.getElementById('table-header');
            const tableBody = document.getElementById('table-body');
            const rankingBox = document.getElementById('ranking-box');

            if (data.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="15" style="text-align:center; padding: 30px;">Nenhum dado encontrado para os filtros selecionados.</td></tr>';
                rankingBox.innerHTML = '';
                return;
            }

            const headers = Object.keys(data[0]);
            tableHeader.innerHTML = headers.map(h => `<th>${h}</th>`).join('');

            // Lógica do Ranking (Top 3)
            const metricHeader = headers.find(h => h.includes('%')) || headers[1];
            const sorted = [...data].sort((a, b) => (parseFloat(b[metricHeader]) || 0) - (parseFloat(a[metricHeader]) || 0)).slice(0, 3);
            
            const medals = ['🥇 1º LUGAR', '🥈 2º LUGAR', '🥉 3º LUGAR'];
            rankingBox.innerHTML = sorted.map((item, i) => `
                <div class="rank-card">
                    <h4>${medals[i]}</h4>
                    <span class="rank-loja">${item[colLoja] || '---'}</span>
                    <div class="rank-val">${item[metricHeader]}${typeof item[metricHeader] === 'number' ? '%' : ''}</div>
                </div>
            `).join('');

            // Preenche Tabela
            tableBody.innerHTML = data.map(row => `
                <tr>
                    ${headers.map(h => {
                        let val = row[h];
                        let cls = '';
                        if (typeof val === 'number' && h.includes('%')) {
                            if (val >= 95) cls = 'perf-green';
                            else if (val >= 90) cls = 'perf-yellow';
                            else cls = 'perf-red';
                            val = val.toFixed(1) + '%';
                        }
                        return `<td class="${cls}">${val ?? '-'}</td>`;
                    }).join('')}
                </tr>
            `).join('');
        }

        function exportExcel() {
            const table = document.getElementById("data-table");
            const wb = XLSX.utils.table_to_book(table);
            XLSX.writeFile(wb, "Relatorio_Hub_Pinheiro.xlsx");
        }
    </script>
</body>
</html>
