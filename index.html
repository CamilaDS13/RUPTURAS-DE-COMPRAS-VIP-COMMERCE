<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RUPTURAS DA LOJA ONLINE</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f8fafc; margin: 0; padding: 20px; color: #1e293b; }
    .container { max-width: 1200px; margin: 0 auto; }
    
    /* Cabeçalho */
    header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 20px; 
      background: #fff; 
      padding: 15px 25px; 
      border-radius: 12px; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .logo-box { display: flex; align-items: center; gap: 10px; }
    .logo-pinheiro { height: 55px; width: auto; object-fit: contain; }
    .logo-app { height: 48px; width: auto; object-fit: contain; }
    h1 { margin: 0; font-size: 1.4rem; color: #0f172a; text-align: center; flex-grow: 1; font-weight: 700; }

    /* Filtros e Legendas */
    .controles-card {
      background: #fff;
      padding: 15px 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: flex;
      gap: 15px;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
      flex-wrap: wrap;
    }
    .filtros-group { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    label { font-size: 0.9rem; font-weight: 600; color: #475569; }
    select { padding: 9px 14px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 0.9rem; background: #fff; font-weight: 500; cursor: pointer; outline: none; }

    /* Legenda de Cores */
    .legenda-cores {
      display: flex;
      gap: 15px;
      align-items: center;
      background: #f1f5f9;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .legenda-item { display: flex; align-items: center; gap: 6px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    .dot-ok { background-color: #16a34a; }
    .dot-alerta { background-color: #ca8a04; }
    .dot-critico { background-color: #dc2626; }

    /* Cards */
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .card { background: #fff; padding: 18px 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-left: 5px solid #2563eb; }
    .card h3 { margin: 0 0 8px 0; font-size: 0.8rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
    .card .value { font-size: 1.7rem; font-weight: 700; color: #0f172a; }
    
    /* Tabela */
    .table-container { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 12px 16px; border-bottom: 1px solid #f1f5f9; font-size: 0.92rem; }
    th { background-color: #f8fafc; font-weight: 600; color: #475569; border-bottom: 2px solid #e2e8f0; }
    tr:hover { background-color: #f8fafc; }

    /* Badges Dinâmicos por Cor */
    .badge-status { font-weight: 600; padding: 4px 8px; border-radius: 4px; display: inline-block; }
    .status-ok { color: #15803d; background: #f0fdf4; }
    .status-alerta { color: #a16207; background: #fefce8; }
    .status-critico { color: #b91c1c; background: #fef2f2; }
  </style>
</head>

  function inicializarDatas() {
    const mesSel = document.getElementById("filtroMes").value;
    const selectData = document.getElementById("filtroData");
    selectData.innerHTML = '<option value="GERAL">Visão Geral do Mês</option>';

    const datasDoMes = [...new Set(dados.filter(d => d.mes === mesSel).map(d => d.data))].sort();
    datasDoMes.forEach(d => {
      const parts = d.split('-');
      const dataFormatada = `${parts[2]}/${parts[1]}/${parts[0]}`;
      const opt = document.createElement("option");
      opt.value = d;
      opt.textContent = dataFormatada;
      selectData.appendChild(opt);
    });

    filtrar();
  }

  function mudarMes() {
    inicializarDatas();
  }

  function obterClasseStatus(taxa) {
    const valor = parseFloat(taxa);
    if (valor <= 10) return "status-ok";
    if (valor <= 20) return "status-alerta";
    return "status-critico";
  }

  function filtrar() {
    const mesSel = document.getElementById("filtroMes").value;
    const dataSel = document.getElementById("filtroData").value;

    let filtrados = dados.filter(d => d.mes === mesSel);
    if (dataSel !== "GERAL") {
      filtrados = filtrados.filter(d => d.data === dataSel);
    }

    const consolidado = {};
    let totCompras = 0, totItens = 0, totExcluidos = 0;

    filtrados.forEach(item => {
      if (!consolidado[item.loja]) {
        consolidado[item.loja] = { compras: 0, itens: 0, excluidos: 0 };
      }
      consolidado[item.loja].compras += item.compras;
      consolidado[item.loja].itens += item.itens;
      consolidado[item.loja].excluidos += item.excluidos;

      totCompras += item.compras;
      totItens += item.itens;
      totExcluidos += item.excluidos;
    });

    document.getElementById("cardCompras").innerText = totCompras.toLocaleString("pt-BR");
    document.getElementById("cardItens").innerText = totItens.toLocaleString("pt-BR");
    document.getElementById("cardExcluidos").innerText = totExcluidos.toLocaleString("pt-BR");
    
    const taxaGeral = totItens > 0 ? ((totExcluidos / totItens) * 100).toFixed(2) : "0,00";
    document.getElementById("cardTaxa").innerText = taxaGeral.replace('.', ',') + "%";

    const tbody = document.querySelector("#tabelaDados tbody");
    tbody.innerHTML = "";

    Object.keys(consolidado).forEach(loja => {
      const d = consolidado[loja];
      const taxa = d.itens > 0 ? ((d.excluidos / d.itens) * 100).toFixed(2) : "0,00";
      const classeColor = obterClasseStatus(taxa);

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><strong>${loja}</strong></td>
        <td>${d.compras.toLocaleString("pt-BR")}</td>
        <td>${d.itens.toLocaleString("pt-BR")}</td>
        <td>${d.excluidos.toLocaleString("pt-BR")}</td>
        <td><span class="badge-status ${classeColor}">${taxa.replace('.', ',')}%</span></td>
      `;
      tbody.appendChild(tr);
    });
  }

  window.onload = inicializarDatas;
